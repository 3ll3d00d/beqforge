name: Build executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write  # softprops/action-gh-release needs to create/attach to the release

jobs:
  package:
    name: Build Python package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import email
          import os
          import pathlib
          import zipfile

          wheel, = pathlib.Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              metadata, = (name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              version = email.message_from_bytes(archive.read(metadata))["Version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}, matching the package version")
          PY
      - name: Validate package metadata
        run: uvx twine check --strict dist/*
      - name: Verify dependency profiles
        run: |
          for profile in base designer optimiser device-check all; do
            uv run --no-project --python 3.13 python tools/smoke_test_install.py --wheel-dir dist --profile "$profile"
          done
      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  create_release:
    name: Create release
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # changelog-generator diffs against the previous tag

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v5.0.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.os }})
    # runs regardless of trigger (workflow_dispatch builds without a release to attach to);
    # only waits on create_release, and only when that job actually ran, so a tag push still
    # uploads to one release created once rather than racing three matrix legs to create it.
    needs: [create_release]
    if: always() && (needs.create_release.result == 'success' || needs.create_release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: beqforge-linux-x86_64
            built_path: dist/beqforge
          - os: macos-latest
            asset_name: beqforge-macos-x86_64
            built_path: dist/beqforge
          - os: windows-latest
            asset_name: beqforge-windows-x86_64.exe
            built_path: dist/beqforge.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra designer

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        run: uv run --extra designer pyinstaller --clean beqforge.spec

      - name: Smoke-test the built executable
        run: uv run --extra designer python tools/smoke_test_exe.py "${{ matrix.built_path }}"

      - name: Rename artifact
        run: cp "${{ matrix.built_path }}" "${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Python package to PyPI
    needs: [package, build, create_release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/beqforge/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Attach distributions to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
