name: Designer image

# The designer as a container, beside a beqdesigner pipeline service (README, "Running the
# designer in a container"). Every change to what goes into it is built and smoke-tested;
# a vX.Y.Z tag also publishes linux/amd64 and linux/arm64 to GHCR as ghcr.io/<owner>/beqforge-designer.
# A manual run with `publish` publishes the image of an existing release from a later commit,
# only if the designer's runtime code is identical to that release's tag (as when the image
# recipe arrived after the release).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'packaging/designer/**'
      - '.dockerignore'
      - '.github/workflows/build-designer-image.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'beq_common/**'
      - 'beqforge/**'
      - 'tools/designer_server.py'
  pull_request:
    paths:
      - 'packaging/designer/**'
      - '.dockerignore'
      - '.github/workflows/build-designer-image.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image as beq_common.__version__ (its vX.Y.Z tag must exist, with identical designer code)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: designer-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # the arm64 image builds under emulation
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release tags, for a manual publish's check
      - name: Choose whether to publish
        id: publish
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || "${{ inputs.publish }}" == true ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set image version
        id: version
        shell: bash
        run: |
          version="$(python3 -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('beq_common/__init__.py').read_text()).group(1))")"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match beq_common.__version__ $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/tags/* && "${{ inputs.publish }}" == true ]]; then
            # the image says it is release $version: what it runs must be exactly that release's
            if ! git diff --quiet "v$version" HEAD -- beqforge beq_common tools/designer_server.py; then
              echo "the designer code differs from v$version: tag a release instead" >&2
              git diff --stat "v$version" HEAD -- beqforge beq_common tools/designer_server.py >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build image for smoke test
        run: |
          docker build -f packaging/designer/Dockerfile -t beqforge-designer:smoke \
            --build-arg VERSION="${{ steps.version.outputs.version }}" --build-arg REVISION="$GITHUB_SHA" .
      - name: Health, and a design inline and by reference
        run: python3 packaging/designer/smoke.py beqforge-designer:smoke
      - uses: docker/setup-qemu-action@v4
        if: steps.publish.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.publish.outputs.publish == 'true'
      - name: Log in to GHCR
        if: steps.publish.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose tags
        id: tags
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/beqforge-designer"
          version="${{ steps.version.outputs.version }}"
          tags="$image:$version"
          if [[ ! "$version" =~ (a|b|rc|dev)[0-9]*$ ]]; then
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and publish amd64 and arm64
        if: steps.publish.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/designer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
