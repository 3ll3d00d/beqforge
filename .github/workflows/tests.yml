name: Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # brew's and choco's default ffmpeg both lack the libsoxr resampler tools/extract.py
      # prefers, unlike Ubuntu's apt package — but extract.py now detects that at runtime and
      # falls back to ffmpeg's default resampler, so any ordinary ffmpeg install is fine here.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # the device-check tests run in their own job below, in parallel, with the extra installed
      - name: Run tests
        run: uv run pytest --ignore-glob='tests/test_device_check_*.py'

  device-check:
    name: Device check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # without the extra, most of these tests skip on importorskip('pyfar') rather than fail
      - name: Install dependencies
        run: uv sync --locked --all-groups --extra device-check

      - name: Run device-check tests
        shell: bash
        run: uv run pytest tests/test_device_check_*.py
