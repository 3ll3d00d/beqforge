name: Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # apt/brew/choco ffmpeg builds are inconsistent about optional filters — brew's and
      # choco's default ffmpeg both lack the libsoxr resampler tools/extract.py asks for
      # (`Requested resampling engine is unavailable`), even though Ubuntu's apt package has
      # it. FedericoCarboni/setup-ffmpeg's Linux/Windows builds (johnvansickle static /
      # gyan.dev full) do include it, but its macOS source (evermeet.cx) is x64-only and
      # macos-latest runners are arm64 — so macOS gets its own libsoxr-enabled build via the
      # homebrew-ffmpeg tap, which compiles natively for whatever arch it runs on.
      - name: Install ffmpeg (Linux, Windows)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew uninstall --ignore-dependencies ffmpeg || true
          brew tap homebrew-ffmpeg/ffmpeg
          brew install homebrew-ffmpeg/ffmpeg/ffmpeg --with-libsoxr

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest
