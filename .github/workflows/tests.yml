name: Tests

# Fits already control their own process parallelism. Avoid multiplying each worker
# by a BLAS thread pool on the small hosted runners.
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

on:
  workflow_call:
  push:
    branches:
      - '**'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # brew's and choco's default ffmpeg both lack the libsoxr resampler tools/extract.py
      # prefers, unlike Ubuntu's apt package — but extract.py now detects that at runtime and
      # falls back to ffmpeg's default resampler, so any ordinary ffmpeg install is fine here.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            exit 0
          fi
          # The Azure mirror took over eight minutes to download ffmpeg's
          # dependencies on a hosted runner. Use Ubuntu's archive mirror.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --extra designer

      # the device-check tests run in their own job below, in parallel, with the extra installed
      - name: Run tests
        run: uv run --extra designer pytest --durations=25 --ignore-glob='tests/test_device_check_*.py'

  device-check:
    name: Device check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # without the extra, most of these tests skip on importorskip('pyfar') rather than fail
      - name: Install dependencies
        run: uv sync --locked --all-groups --extra device-check

      - name: Run device-check tests
        shell: bash
        run: uv run --extra device-check pytest --durations=25 tests/test_device_check_*.py

  package-profiles:
    name: Install profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [base, designer, optimiser, device-check, all]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Build the single distribution
        run: uv build --out-dir dist
      - name: Verify isolated wheel installation and command
        run: uv run --no-project --python 3.13 python tools/smoke_test_install.py --wheel-dir dist --profile '${{ matrix.profile }}'
