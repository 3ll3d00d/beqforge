name: Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # apt/brew/choco ffmpeg builds are inconsistent about optional filters — brew's and
      # choco's default ffmpeg both lack the libsoxr resampler tools/extract.py asks for
      # (`Requested resampling engine is unavailable`), even though Ubuntu's apt package has
      # it. This installs the same libsoxr-enabled build (gyan.dev full / evermeet.cx /
      # johnvansickle static, per OS) everywhere, so all three legs decode identically.
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest
