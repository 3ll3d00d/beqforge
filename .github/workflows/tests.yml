name: Tests

# Fits already control their own process parallelism. Avoid multiplying each worker
# by a BLAS thread pool on the small hosted runners.
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'

on:
  workflow_call:
  push:
    branches:
      - '**'

# A newer push to a feature branch supersedes its in-progress run. main and tag (release) runs are
# grouped per commit so they are never cancelled or queued behind each other: a release reuses
# main's result for the tagged commit.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # feature branch pushes only test on Linux; main, tags (releases) and manual runs test all three
        os: ${{ fromJSON(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      # brew's and choco's default ffmpeg both lack the libsoxr resampler tools/extract.py
      # prefers, unlike Ubuntu's apt package — but extract.py now detects that at runtime and
      # falls back to ffmpeg's default resampler, so any ordinary ffmpeg install is fine here.
      # apt mirrors have repeatedly taken from 8 to over 50 minutes to serve ffmpeg's dependencies on
      # hosted runners, so use a static build from GitHub releases (which also includes libsoxr) and
      # only fall back to apt if that download fails.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            exit 0
          fi
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          if curl -fsSL --retry 3 --max-time 300 "$url" -o "$RUNNER_TEMP/ffmpeg.tar.xz"; then
            mkdir -p "$RUNNER_TEMP/ffmpeg"
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
            echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          else
            # the Azure mirror is the slowest, use Ubuntu's archive mirror
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --extra designer

      # the device-check tests run in their own job below, in parallel, with the extra installed
      - name: Run tests
        run: uv run --extra designer pytest -n auto --durations=25 --ignore-glob='tests/test_device_check_*.py'

  device-check:
    name: Device check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # feature branch pushes only test on Linux; main, tags (releases) and manual runs test all three
        os: ${{ fromJSON(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # without the extra, most of these tests skip on importorskip('pyfar') rather than fail
      - name: Install dependencies
        run: uv sync --locked --all-groups --extra device-check

      - name: Run device-check tests
        shell: bash
        run: uv run --extra device-check pytest -n auto --durations=25 tests/test_device_check_*.py

  package-profiles:
    name: Install profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [base, designer, optimiser, device-check, all]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Build the single distribution
        run: uv build --out-dir dist
      - name: Verify isolated wheel installation and command
        run: uv run --no-project --python 3.13 python tools/smoke_test_install.py --wheel-dir dist --profile '${{ matrix.profile }}'
