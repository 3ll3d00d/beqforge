name: Build device-check preview

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    paths:
      - 'beqforge_device_check/**'
      - 'beqforge-device-check.spec'
      - 'tools/prepare_device_check_helper.py'
      - 'tools/smoke_test_device_check.py'
      - 'packaging/device-check/**'
      - '.github/workflows/build-device-check.yml'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Preview (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            executable: beqforge-device-check
          - os: windows-2022
            target: windows-x86_64
            executable: beqforge-device-check.exe
          - os: macos-15
            target: macos-arm64
            executable: beqforge-device-check
          - os: macos-15-intel
            target: macos-x86_64
            executable: beqforge-device-check
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install Linux audio and USB libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libusb-1.0-0
      - name: Install locked measurement dependencies and pinned packager
        run: |
          uv sync --locked --extra device-check
          uv pip install pyinstaller==6.22.3
      - name: Prepare pinned native helper
        run: uv run --extra device-check python tools/prepare_device_check_helper.py --target '${{ matrix.target }}' --out build/device-helper --cache build/helper-cache
      - name: Diagnose folder build
        env:
          BEQFORGE_DEVICE_BUILD_MODE: onedir
        run: |
          uv run --extra device-check pyinstaller --clean --noconfirm --distpath dist/folder beqforge-device-check.spec
          uv run --extra device-check python tools/smoke_test_device_check.py 'dist/folder/beqforge-device-check/${{ matrix.executable }}' --out 'build/folder test é'
      - name: Build and verify single executable
        run: |
          uv run --extra device-check pyinstaller --clean --noconfirm --distpath dist/single beqforge-device-check.spec
          uv run --extra device-check python tools/smoke_test_device_check.py 'dist/single/${{ matrix.executable }}' --out 'build/single test é' --package 'dist/preview-${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: beqforge-device-check-preview-${{ matrix.target }}
          path: dist/preview-${{ matrix.target }}
          if-no-files-found: error
