# Which designs a designer upgrade may move (TODO 34; designer-interface.md 1.6 §7.1, "Impact").
#
# `beqforge/impact.py` reads this. Two tables:
#
# * [[release]]: how to recognise a record written before records carried their own design
#   identity (0.2.11), by the revision in its fingerprint. A frozen build is matched by its
#   commit, anything else by its source digest (`record._source_digest`), since a wheel or an
#   image has no git checkout. Releases older than `since` are listed so a record from one says
#   which version it was designed at; it is still `unknown`.
# * [[change]]: one entry per answer-changing design version, naming every feature whose code
#   it changed (`tools/impact.py check` enforces that from the diff) and, for each, the kind of
#   change and its degree:
#   - "behaviour": the share of records of each reliance class that moved in the regression
#     check (`degree`, by class; `impact.OUTCOMES` names the classes);
#   - "threshold": the old and new values; a record's recorded figure between them will move;
#   - "all": reaches every design that relies on the feature (at least `likely`);
#   - "unchanged": the code changed but the answers it computes did not (say how that was shown).

