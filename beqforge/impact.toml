[[change]]
id = "bass-ceiling"
design_version = 9
summary = "bass EQ stops at a 60 Hz ceiling: every priced target tapers to nothing by it, the judged band's top is capped there (its one-octave span is not), and above it a cascade may add no more than the level tolerance, a bound the fitter is given too (TODO 39)"
evidence = "plans/bass-ceiling.md#outcome-31-october-2026"

[[change.touches]]
feature = "targets.shared"
kind = "behaviour"
# Measured on the library, moved by `impact.MOVED`, together with judge.overlift (one change,
# not separable): v8 library titles designed at version 8 and 9 on one machine, from the
# library's audio with default settings. The designed classes are 60 titles lifting 3 dB above
# 60 Hz at version 8 (random, plus those named in review) and 20 random others; the declined
# classes a random sample of each. That sample is chosen for what the ceiling reaches, so it is
# split by it: `basis` counts the records `impact.reaches_above` says reach above 60 Hz (a
# judged band ending above it, any target lift above it, or a cascade lifting more than the
# level tolerance above it), `basis_below` the rest. Of the v8 library's 1,033 designs, 365
# reach above it. Below, the moves are fit re-rolls (row 32): the fitter's new bound above
# 60 Hz moves which near-equal fit it lands on, including the 3 declined_after_fit titles that
# now design, whose bands end at 36-43 Hz. Re-rolls don't depend on which side of the ceiling a
# record falls, so declined_after_fit is pooled across both (0 of 3 above, 3 of 9 below), and
# below it the two designed classes are pooled (0 of 3 and 4 of 11).
above_hz = 60.0
above_lift_db = 3.0
basis = { no_fit = [0, 0], declined_after_fit = [3, 12], designed_with_failures = [11, 12], designed_all_passed = [50, 54] }
basis_below = { no_fit = [0, 10], declined_after_fit = [3, 12], designed_with_failures = [4, 14], designed_all_passed = [4, 14] }

