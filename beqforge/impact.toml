# Measured on the library, moved by `impact.MOVED`. no_fit and declined_after_fit: v6 records
# rerun at version 6 and 7 on one machine, from requests identical to the library's
# (plans/redesign-scope.md#outcome); declined_after_fit is every such title, no_fit a random
# sample. A record in either class can only move by being designed, so MOVED's cascade line
# does not reach them. The designed classes: beqdesigner's redesign sample, library v6 records
# against their v7 redesigns, recounted when MOVED's line became 20/f dB (it was a flat 1 dB:
# 15 of 35 and 15 of 60).
