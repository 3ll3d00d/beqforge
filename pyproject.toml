[project]
name = "beqforge"
version = "0.1.0"
description = "Derives a corrective BEQ filter from a film's own audio, with the evidence behind it"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "ruff>=0.14.10",
    "scipy>=1.16.3",
    "scipy-stubs~=1.17.1",
]

[project.scripts]
beqforge = "beqforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beqforge", "tools"]
exclude = ["tools/experiments"]
