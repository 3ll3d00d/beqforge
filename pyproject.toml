[project]
name = "beqforge"
dynamic = ["version"]
description = "Audio-derived BEQ design, published filter optimisation and DSP validation"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["numpy>=2.4.0"]

[project.scripts]
beqforge = "beqforge.cli:main"
beqforge-device-check = "beqforge_device_check.cli:main"
beqoptimiser = "beqoptimiser.cli:main"

[project.optional-dependencies]
designer = ["scipy>=1.16.3", "matplotlib>=3.10.8", "numba>=0.68.0"]
optimiser = ["scipy>=1.16.3"]
device-check = [
    "scipy>=1.16.3",
    "matplotlib>=3.10.8",
    "pyfar==0.8.1",
    "sounddevice==0.5.6",
    "websocket-client==1.9.2",
]
all = [
    "scipy>=1.16.3",
    "matplotlib>=3.10.8",
    "numba>=0.68.0",
    "pyfar==0.8.1",
    "sounddevice==0.5.6",
    "websocket-client==1.9.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "ruff>=0.14.10",
    "scipy-stubs>=1.17.1,<1.19.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# the repository root, so every report path is the file's path in the repository
source = ["."]
omit = ["tests/*", ".venv/*", "build/*", "packaging/*"]
# the designer server's design worker and the fitter's pool are `multiprocessing` processes,
# measured too (and on every platform, unlike `patch = ["fork"]`); every process writes its
# own data file and they are combined at the end of the run
concurrency = ["multiprocessing", "thread"]
patch = ["subprocess"]
relative_files = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.force-include]
"beqoptimiser/data/seed.json.gz" = "beqoptimiser/data/seed.json.gz"
"beqoptimiser/data/seed-manifest.json" = "beqoptimiser/data/seed-manifest.json"

[tool.hatch.build.targets.wheel]
packages = ["beqforge", "beqforge_device_check", "beqoptimiser", "beq_common", "tools"]
exclude = ["tools/experiments"]

[tool.hatch.version]
path = "beq_common/__init__.py"
